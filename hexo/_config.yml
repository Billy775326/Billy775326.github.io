{
  "title": "Billy 的博客",
  "subtitle": "",
  "description": "记录编程开发、系统运维与工具实践。",
  "author": "Billy",
  "language": "zh-CN",
  "timezone": "Asia/Shanghai",
  "url": "https://iowill.com",
  "root": "/",
  "permalink": "blog/:year/:month/:title/",
  "pretty_urls": {
    "trailing_index": false,
    "trailing_html": false
  },
  "source_dir": "source",
  "public_dir": "public",
  "tag_dir": "tags",
  "archive_dir": "archives",
  "category_dir": "categories",
  "code_dir": "downloads/code",
  "i18n_dir": ":lang",
  "skip_render": [
    "js/**",
    "css/**",
    "img/**",
    "CNAME",
    "robots.txt",
    "legacy-html/**"
  ],
  "new_post_name": ":title.md",
  "default_layout": "post",
  "titlecase": false,
  "external_link": {
    "enable": false
  },
  "filename_case": 0,
  "render_drafts": false,
  "post_asset_folder": false,
  "relative_link": false,
  "future": false,
  "syntax_highlighter": "highlight.js",
  "highlight": {
    "enable": true,
    "line_number": true,
    "auto_detect": false,
    "tab_replace": "",
    "wrap": true,
    "hljs": false
  },
  "prismjs": {
    "enable": false
  },
  "default_category": "系统与运维",
  "category_map": {
    "编程开发": "programming",
    "算法与数据结构": "algorithms",
    "系统与运维": "systems-operations",
    "软件与工具": "software-tools",
    "游戏与实践": "gaming"
  },
  "tag_map": {
    "Linux": "linux",
    "C++": "cpp",
    "C++20": "cpp20",
    "Arch Linux": "arch-linux",
    "GitHub Pages": "github-pages",
    "Editor.md": "editor-md"
  },
  "date_format": "YYYY/MM/DD HH:mm:ss",
  "time_format": "HH:mm:ss",
  "updated_option": "date",
  "per_page": 18,
  "pagination_dir": "page",
  "theme": "butterfly",
  "index_generator": {
    "path": "",
    "per_page": 18,
    "order_by": {
      "date": -1,
      "migration_order": 1
    }
  },
  "archive_generator": {
    "per_page": 18,
    "yearly": true,
    "monthly": true,
    "daily": false
  },
  "category_generator": {
    "per_page": 0
  },
  "tag_generator": {
    "per_page": 0
  },
  "search": {
    "path": "search.xml",
    "field": "post",
    "content": true,
    "format": "html"
  },
  "sitemap": {
    "path": "sitemap.xml",
    "rel": false,
    "tags": true,
    "categories": true
  }
}
